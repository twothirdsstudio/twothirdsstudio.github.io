<style>
  /* This page commits to a single fixed light look on purpose (explicit request: background
     stays pure white always, regardless of the viewer's system theme — no dark-mode variant). */
  :root{
    --bg:#ffffff;
    --surface-2:#f0ece3;
    --text:#211d18;
    --text-muted:#948c7c;
    --border:#ddd5c3;
    --accent:#d8303c;
    --accent-contrast:#fff8f2;
  }

  *{ box-sizing:border-box; }
  /* ---------- fixed-viewport shell: the app fills exactly 100vh/100vw and never scrolls as a
     whole — nothing may push html/body/.app taller or wider than the viewport. The sidebar gets
     its own internal scroll (see .sidebar below) if its controls don't fit; the main stage clips
     any residual overflow as a hard safety net, though in normal use the digit display's own
     auto-fit (see computeMaxFitScale()/updateScaleCeiling() in the script) keeps it from ever
     needing to. */
  html{ height:100%; overflow:hidden; }
  body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .app{
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  .sidebar-toggle{
    position:fixed;
    top:1rem;
    left:1rem;
    z-index:30;
    width:30px;
    height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .sidebar-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  .sidebar-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (max-width:480px){
    .sidebar{ width:210px; flex-basis:210px; }
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:240px;
    flex:0 0 240px;
    /* min-height:0 overrides the flex-item default (min-height:auto, which factors in content's
       own intrinsic size and would otherwise let a tall sidebar stretch .app taller than 100vh);
       with it forced to 0, the sidebar is held to exactly .app's height via the default
       align-items:stretch, and overflow-y:auto scrolls INSIDE it instead — the main stage never
       has to shrink or scroll to make room for a long settings panel. */
    min-height:0;
    /* Bug fixed — controls and values (e.g. the scale-slider's "64%"/"71%" readouts) sat flush
       against the sidebar's right edge, sometimes visually clipped in a narrow browser chrome —
       a real bug the user hit (screenshot showed digits cut off at the edge). Widened the
       left/right padding from 1.25rem to 1.5rem and widened the sidebar itself from 220px to
       240px (rather than padding alone, which would have squeezed the already-tight row content
       further) so sliders and their value readouts have comfortable room to sit side by side. */
    padding:3.25rem 1.5rem 1.5rem;
    display:flex;
    flex-direction:column;
    gap:1.5rem;
    border-right:1px solid var(--border);
    overflow-y:auto;
    overflow-x:hidden;
    transition:width .25s ease, padding .25s ease, opacity .2s ease, border-color .25s ease;
  }
  .app.collapsed .sidebar{
    width:0;
    flex-basis:0;
    padding-left:0;
    padding-right:0;
    opacity:0;
    border-right-color:transparent;
    pointer-events:none;
  }
  .brand{ margin:0; }
  .brand-eyebrow{
    display:block;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:.62rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .brand-name{
    display:block;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:.95rem;
    color:var(--text-muted);
    letter-spacing:.02em;
  }

  .lock-row{ display:flex; align-items:center; gap:.5rem; }
  .lock-toggle{
    width:28px;
    height:28px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text-muted);
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .lock-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  .lock-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .lock-icon{ position:relative; width:13px; height:15px; }
  .lock-shackle{
    position:absolute;
    left:1.5px;
    top:0;
    width:10px;
    height:8px;
    box-sizing:border-box;
    border:2px solid currentColor;
    border-bottom:none;
    border-radius:6px 6px 0 0;
    transform-origin:left bottom;
    transition:transform .18s ease;
  }
  .lock-body{
    position:absolute;
    left:0;
    bottom:0;
    width:13px;
    height:8px;
    border-radius:2px;
    background:currentColor;
  }
  .lock-toggle[aria-pressed="false"] .lock-shackle{
    transform:translateX(4px) rotate(-30deg);
  }
  .lock-label{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .tab-list{ display:flex; flex-direction:column; gap:.15rem; }
  .tab-item{
    display:flex;
    align-items:center;
    gap:.35rem;
    padding:.4rem .5rem;
    border-radius:6px;
    cursor:pointer;
  }
  .tab-item:hover{ background:var(--surface-2); }
  .tab-item.active{ background:var(--surface-2); }
  .tab-main{ display:flex; flex-direction:column; gap:.05rem; min-width:0; flex:1; }
  .tab-title-input{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:.76rem;
    color:var(--text-muted);
    background:transparent;
    border:none;
    outline:none;
    padding:0;
    width:100%;
    text-overflow:ellipsis;
  }
  .tab-title-input::placeholder{ color:var(--text-muted); opacity:.55; font-weight:400; }
  .tab-title-input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  .tab-item.active .tab-title-input{ color:var(--accent); }
  .tab-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:.63rem;
    color:var(--text-muted);
    opacity:.7;
  }
  .tab-item.active .tab-date{ color:var(--accent); opacity:.85; }
  .tab-remove{
    background:none; border:none; color:var(--text-muted); opacity:.45;
    font-size:.85rem; line-height:1; cursor:pointer; padding:0 .15rem;
    font-family:inherit;
    flex-shrink:0;
  }
  .tab-remove:hover{ opacity:1; }

  .add-form{
    display:flex;
    flex-direction:column;
    gap:.55rem;
    padding-top:1.1rem;
    border-top:1px solid var(--border);
  }
  .mini-label{
    margin:0;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:.66rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .mini-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:.76rem;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:6px;
    padding:.4rem .5rem;
    width:100%;
    transition:border-color .2s ease;
  }
  .mini-input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; color:var(--text); }
  .mini-input.invalid{ border-color:var(--accent); }
  .mini-input::-webkit-calendar-picker-indicator{ opacity:.5; cursor:pointer; }

  .mini-units{ display:flex; gap:.3rem; flex-wrap:wrap; }
  .mini-chip{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:.64rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:.28rem .5rem;
    border-radius:5px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .mini-chip:hover{ color:var(--text); }

     for "next to" placement — it scales with viewport width so there's always some, without
     turning into the whole page. The area sits fixed in the center of .stage (flexbox); only the
     image's and the title's own positions within it are free-floating — each is a fraction of

     them horizontally-fixed/vertically-free, and the image additionally tracks that offset). */

    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    /* The lower bound of each clamp() used to be a fixed 90px/60px floor that never shrank
       further, which was fine back when the page could grow/scroll to fit its content. Now that
       nothing may scroll (see the fixed-viewport shell below), that floor became a hard trap on

       digits no matter how far the auto-fit (computeMaxFitScale(), see further down) shrank them

       floor to 12px/16px keeps the padding identical at every normal (>~560px-wide) window size,

        <input type="range" class="scale-slider" id="scale-slider" min="0.25" max="1.6" step="0.01" value="1" aria-label="Größe der Zahlenanzeige">
        <span class="scale-value" id="scale-value">100%</span>
      </div>
    </div>

    <p class="sidebar-note">Läuft lokal im Browser, basierend auf der Systemzeit dieses Geräts.</p>
  </aside>

  <main class="stage">
    <div class="countdown-area" id="countdown-area">
      <div class="digit-groups" id="digit-groups">
        <span class="digits-handle" id="digits-handle" title="Nach oben/unten ziehen" aria-hidden="true"><span class="tb-handle-icon"><span></span><span></span><span></span><span></span><span></span><span></span></span></span>
      </div>
      <div class="image-wrap" id="image-wrap" hidden>
        <span class="image-handle" id="image-handle" title="Ziehen zum Verschieben" aria-hidden="true"><span class="tb-handle-icon"><span></span><span></span><span></span><span></span><span></span><span></span></span></span>
        <img class="countdown-image" id="countdown-image" alt="" draggable="false">
      </div>
      <div class="title-zone" id="title-zone" hidden>
        <div class="title-toolbar" id="title-toolbar">
          <span class="tb-handle" id="tb-handle" title="Ziehen zum Verschieben" aria-hidden="true"><span class="tb-handle-icon"><span></span><span></span><span></span><span></span><span></span><span></span></span></span>
        </div>
        <h2 class="countdown-title" id="countdown-title" contenteditable="true" spellcheck="false"></h2>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';

  var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STAGGER_MS = 32;
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var STORAGE_KEY = 'split-flap-countdown/v1';
  var VALID_UNIT_KEYS = ['d','h','m','s'];
  /* Bug fixed — MIN_SCALE used to be 0.5, chosen back when it was just the slider's own nominal
     floor with no relationship to what actually fits. Once the auto-fit ceiling became the
     slider's own `max` (see "Fixed viewport / no scrolling"), a MIN_SCALE this close to many
     real-world ceilings (e.g. maxFitScale measured ~0.51 at a common 1280×800 window) collapsed
     the slider's whole draggable span down to a sliver just a few hundredths wide — smaller than
     its own 0.01 `step`, which made real mouse dragging register no change at all (a real,
     user-reported regression: "kein Klicken, kein Ziehen möglich"). Lowered to 0.25 so the floor
     sits comfortably below every ceiling seen across a wide range of tested window sizes
     (~0.5–1.6), guaranteeing a wide, smoothly draggable span everywhere except genuinely extreme,
     very narrow windows (already a documented, accepted edge case — see "Known design decisions").
     `#scale-slider`'s HTML `min` attribute was updated to match. */
  var MIN_SCALE = 0.25, MAX_SCALE = 1.6, DEFAULT_SCALE = 1;
  var DEFAULT_SEG_COLOR = '#ef4a52';
  var HEX_COLOR_RE = /^#[0-9a-fA-F]{6}$/;

  var UNIT_DEFS = [
    { key:'d', label:'Tage',     secs:86400 },
    { key:'h', label:'Stunden',  secs:3600  },
    { key:'m', label:'Minuten',  secs:60    },
    { key:'s', label:'Sekunden', secs:1     }
  ];

  /* currently displayed countdown */
  var selected = new Set(['d','h','m','s']);
  var targetDate = null;

  /* all countdowns */
  var tabs = [];
  var activeId = null;
  var nextId = 1;

  /* global display size, applies to all countdowns */
  var displayScale = DEFAULT_SCALE;

  /* global edit lock — when true, nothing (title or countdown) can be dragged */
  var locked = false;

  /* ---------- 7-segment geometry (viewBox 0 0 60 100, split exactly at y=50) ---------- */
  function pts(list){
    var out = [];
    for (var i = 0; i < list.length; i += 2) out.push(list[i] + ',' + list[i + 1]);
    return out.join(' ');
  }
  function hsegPts(yc){ return pts([16,yc-5, 44,yc-5, 50,yc, 44,yc+5, 16,yc+5, 10,yc]); }
  function vsegPts(xc, y1, y2){ return pts([xc-5,y1+8, xc,y1, xc+5,y1+8, xc+5,y2-8, xc,y2, xc-5,y2-8]); }

  var SEG_POINTS = {
    a: hsegPts(8),
    g: hsegPts(50),
    d: hsegPts(92),
    f: vsegPts(10, 8, 50),
    b: vsegPts(50, 8, 50),
    e: vsegPts(10, 50, 92),
    c: vsegPts(50, 50, 92)
  };
  var SEG_ORDER = ['a','b','c','d','e','f','g'];
  var DIGIT_SEGMENTS = {
    '0':'abcdef', '1':'bc', '2':'abged', '3':'abgcd', '4':'fgbc',
    '5':'afgcd', '6':'afgecd', '7':'abc', '8':'abcdefg', '9':'abcdfg'
  };

  function isHorizontalSeg(seg){ return seg === 'a' || seg === 'g' || seg === 'd'; }

  /* yPct:0 puts the "quick position" presets at the top of the countdown area — i.e. above the
     numbers, the traditional spot — rather than smack in the middle of the digit display, now
     that the title's coordinate space spans the whole area (digits included). */
  var ALIGN_PRESETS = {
    left:   { xPct:0,   yPct:0 },
    center: { xPct:0.5, yPct:0 },
    right:  { xPct:1,   yPct:0 }
  };
  function defaultFormat(){ return { pos:{ xPct:0.5, yPct:0 } }; }
  var GRADIENT_DIRECTIONS = ['horizontal', 'vertical', 'diagonal'];
  function defaultGradient(){ return { enabled:false, from:'#d8303c', to:'#2b6cff', direction:'horizontal' }; }
  function defaultRun(text){ return { text:text || '', bold:false, italic:false, color:null, fontSize:null, fontFamily:'' }; }

  /* per-run font family — a small curated set of clearly distinct choices rather than free-form
     font names, so every saved value is guaranteed renderable. '' (the default option) means "no
     override", i.e. inherit .countdown-title's own font (Rajdhani) — matches every title saved
     before this feature existed, so old data renders identically. */
  var FONT_OPTIONS = [
    { key:'',            stack:null },
    { key:'serif',       stack:"'Playfair Display', Georgia, 'Times New Roman', serif" },
    { key:'monospace',   stack:"'IBM Plex Mono', 'Courier New', monospace" },
    { key:'handwriting', stack:"'Caveat', 'Segoe Script', 'Bradley Hand', cursive" },
    { key:'display',     stack:"'Bebas Neue', Impact, 'Arial Black', sans-serif" }
  ];
  function fontStackFor(key){
    var opt = FONT_OPTIONS.filter(function(o){ return o.key === key; })[0];
    return opt ? opt.stack : null;
  }

  /* per-tab optional image, shown above the whole countdown (see .countdown-image in the CSS).
     scale is the sidebar slider's multiplier (0.4–2, default 1) on top of the responsive base
     size; src is a downscaled/compressed data: URL (see downscaleImage()) or null for "no image". */
  var MIN_IMAGE_SCALE = 0.4, MAX_IMAGE_SCALE = 2, DEFAULT_IMAGE_SCALE = 1;
  var IMAGE_MAX_WIDTH = 800, IMAGE_JPEG_QUALITY = 0.85;
  function defaultImage(){ return { src:null, scale:DEFAULT_IMAGE_SCALE }; }
  function clampImageScale(v){ return Math.min(MAX_IMAGE_SCALE, Math.max(MIN_IMAGE_SCALE, v)); }
  /* the image's free-drag position — same {xPct,yPct} fractional convention as tab.format.pos.
     Defaults to top-center, approximating where the image always used to sit (as a fixed banner
     above everything) before it became draggable; not an exact pixel match (there isn't one, now
     that it shares the title's coordinate space) but the closest sensible "untouched" spot. */
  function defaultImagePos(){ return { xPct:0.5, yPct:0 }; }
  /* downscales + re-encodes an already-loaded <img> via canvas so a multi-MB photo doesn't blow
     the localStorage quota once base64-encoded. Flattens onto white first — JPEG has no alpha
     channel, and canvas composites transparent pixels onto black by default when flattened,
     which would otherwise turn a transparent PNG's background solid black instead of white. */
  function downscaleImage(img, maxWidth, quality){
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    var scale = w > maxWidth ? maxWidth / w : 1;
    var targetW = Math.max(1, Math.round(w * scale));
    var targetH = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, targetW, targetH);
    ctx.drawImage(img, 0, 0, targetW, targetH);
    return canvas.toDataURL('image/jpeg', quality);
  }
  function plainText(tab){ return (tab.titleRuns || []).map(function(r){ return r.text; }).join(''); }
  function clamp01(v){ return Math.min(1, Math.max(0, v)); }
  function clampScale(v){ return Math.min(MAX_SCALE, Math.max(MIN_SCALE, v)); }

  /* ---------- persistence — every countdown, its rich-text title runs and its position survive a reload ---------- */
  function saveState(){
    try{
      var data = {
        activeId: activeId,
        displayScale: displayScale,
        locked: locked,
        tabs: tabs.map(function(t){
          return {
            id:t.id,
            targetDate:t.targetDate.toISOString(),
            units:Array.from(t.units),
            format:t.format || defaultFormat(),
            segmentColor:t.segmentColor || DEFAULT_SEG_COLOR,
            titleVisible:t.titleVisible !== false,
            glow:!!t.glow,
            gradient:t.gradient || defaultGradient(),
            image:t.image || defaultImage(),
            imagePos:t.imagePos || defaultImagePos(),
            digitsYPct: typeof t.digitsYPct === 'number' ? t.digitsYPct : 0.5,
            titleRuns:(t.titleRuns || []).map(function(r){
              return { text:r.text, bold:!!r.bold, italic:!!r.italic, color:r.color || null, fontSize:r.fontSize || null, fontFamily:r.fontFamily || '' };
            })
          };
        })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){ /* storage unavailable (private mode, quota) — state just won't persist */ }
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tabs)) return null;

      var restored = parsed.tabs.map(function(t){
        var id = Number(t && t.id);
        var d = new Date(t && t.targetDate);
        if (!id || isNaN(d.getTime())) return null;
        var units = Array.isArray(t.units) ? t.units.filter(function(u){ return VALID_UNIT_KEYS.indexOf(u) !== -1; }) : [];
        if (units.length === 0) units = VALID_UNIT_KEYS.slice();

        var rf = t.format || {};
        var pos = rf.pos && typeof rf.pos.xPct === 'number' && typeof rf.pos.yPct === 'number'
          ? { xPct: clamp01(rf.pos.xPct), yPct: clamp01(rf.pos.yPct) }
          : (ALIGN_PRESETS[rf.align] || defaultFormat().pos); // migrate old align-only format
        var format = { pos: pos };

        var titleRuns;
        if (Array.isArray(t.titleRuns) && t.titleRuns.length){
          titleRuns = t.titleRuns.map(function(r){
            return {
              text: typeof r.text === 'string' ? r.text : '',
              bold: !!r.bold, italic: !!r.italic,
              color: typeof r.color === 'string' ? r.color : null,
              fontSize: (typeof r.fontSize === 'number' && r.fontSize > 0) ? r.fontSize : null,
              fontFamily: (typeof r.fontFamily === 'string' && FONT_OPTIONS.some(function(o){ return o.key === r.fontFamily; })) ? r.fontFamily : ''
            };
          });
        } else if (typeof t.title === 'string' && t.title){
          // migrate a pre-rich-text tab: old whole-title bold/italic/fontSize become the single run's style
          titleRuns = [{ text:t.title, bold:!!rf.bold, italic:!!rf.italic, color:null, fontSize:(typeof rf.fontSize==='number'&&rf.fontSize>0)?rf.fontSize:null, fontFamily:'' }];
        } else {
          titleRuns = [];
        }

        var segmentColor = typeof t.segmentColor === 'string' && HEX_COLOR_RE.test(t.segmentColor)
          ? t.segmentColor
          : DEFAULT_SEG_COLOR;
        var titleVisible = t.titleVisible !== false;
        var glow = t.glow === true;

        var rg = t.gradient || {};
        var gd = defaultGradient();
        var gradient = {
          enabled: rg.enabled === true,
          from: typeof rg.from === 'string' && HEX_COLOR_RE.test(rg.from) ? rg.from : gd.from,
          to: typeof rg.to === 'string' && HEX_COLOR_RE.test(rg.to) ? rg.to : gd.to,
          direction: GRADIENT_DIRECTIONS.indexOf(rg.direction) !== -1 ? rg.direction : gd.direction
        };

        var ri = t.image || {};
        var image = {
          src: typeof ri.src === 'string' && ri.src.indexOf('data:image/') === 0 ? ri.src : null,
          scale: typeof ri.scale === 'number' && !isNaN(ri.scale) ? clampImageScale(ri.scale) : DEFAULT_IMAGE_SCALE
        };

        var rip = t.imagePos || {};
        var imagePos = (typeof rip.xPct === 'number' && typeof rip.yPct === 'number')
          ? { xPct: clamp01(rip.xPct), yPct: clamp01(rip.yPct) }
          : defaultImagePos();

        var digitsYPct = typeof t.digitsYPct === 'number' && !isNaN(t.digitsYPct) ? clamp01(t.digitsYPct) : 0.5;

        return { id:id, targetDate:d, units:new Set(units), format:format, segmentColor:segmentColor, titleVisible:titleVisible, glow:glow, gradient:gradient, image:image, imagePos:imagePos, digitsYPct:digitsYPct, titleRuns:titleRuns };
      }).filter(Boolean);

      if (restored.length === 0) return null;
      var scale = typeof parsed.displayScale === 'number' && !isNaN(parsed.displayScale)
        ? clampScale(parsed.displayScale)
        : DEFAULT_SCALE;
      var lockedState = typeof parsed.locked === 'boolean' ? parsed.locked : false;
      return { activeId: parsed.activeId, displayScale: scale, locked: lockedState, tabs: restored };
    }catch(e){ return null; }
  }

  /* ---------- digit cell — each of the 7 segments is its own rotating plate ---------- */
  function makeDigitCell(){
    var cell = document.createElement('div');
    cell.className = 'digit-cell';

    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 60 100');
    svg.setAttribute('aria-hidden', 'true');
    cell.appendChild(svg);

    var segEls = {};
    var segOn = {};
    SEG_ORDER.forEach(function(seg){
      var poly = document.createElementNS(SVG_NS, 'polygon');
      poly.setAttribute('points', SEG_POINTS[seg]);
      poly.setAttribute('class', 'seg');
      svg.appendChild(poly);
      segEls[seg] = poly;
      segOn[seg] = false;
    });

    function paint(seg, on, delayMs, immediate){
      var el = segEls[seg];
      var axis = isHorizontalSeg(seg) ? 'X' : 'Y';
      var rest = on ? '0deg' : '90deg';

      if (REDUCED_MOTION || immediate){
        el.style.transition = 'none';
        el.style.transform = 'rotate' + axis + '(' + rest + ')';
        el.style.opacity = on ? '1' : '0';
        el.classList.toggle('on', on);
        void el.getBoundingClientRect();
        el.style.transition = '';
      } else {
        el.style.transitionDelay = delayMs + 'ms';
        el.style.transform = 'rotate' + axis + '(' + rest + ')';
        el.style.opacity = on ? '1' : '0';
        el.classList.toggle('on', on);
      }
      segOn[seg] = on;
    }

    var state = {
      el: cell,
      current: null,
      setValue: function(d, immediate){
        if (d === state.current) return;
        var wantOn = {};
        (DIGIT_SEGMENTS[d] || '').split('').forEach(function(s){ wantOn[s] = true; });

        var step = 0;
        SEG_ORDER.forEach(function(seg){
          var on = !!wantOn[seg];
          if (on === segOn[seg]) return;
          paint(seg, on, step * STAGGER_MS, immediate);
          step++;
        });
        state.current = d;
      }
    };

    state.setValue('0', true);
    return state;
  }

  /* ---------- groups (only the active tab is mounted) ---------- */
  var digitGroupsEl = document.getElementById('digit-groups');
  var digitsHandle = document.getElementById('digits-handle'); /* the vertical-drag grip — see rebuildGroups() below for why it's re-appended after every innerHTML wipe */
  var groups = {};

  function rebuildGroups(){
    digitGroupsEl.innerHTML = '';
    digitGroupsEl.appendChild(digitsHandle); /* innerHTML='' above also removes it — move the same node back in rather than losing it (or its listeners) on every rebuild */
    groups = {};
    var order = UNIT_DEFS.filter(function(u){ return selected.has(u.key); });

    order.forEach(function(u){
      var group = document.createElement('div');
      group.className = 'unit-group';

      var digits = document.createElement('div');
      digits.className = 'digits';

      var label = document.createElement('span');
      label.className = 'unit-label';
      label.textContent = u.label;

      group.appendChild(digits);
      group.appendChild(label);
      digitGroupsEl.appendChild(group);

      groups[u.key] = { digitsEl:digits, cells:[] };
    });
  }

  function ensureCellCount(key, n){
    var g = groups[key];
    if (!g) return;
    while (g.cells.length < n){
      var c = makeDigitCell();
      g.cells.unshift(c);
      g.digitsEl.insertBefore(c.el, g.digitsEl.firstChild);
    }
    while (g.cells.length > n && g.cells.length > 2){
      var removed = g.cells.shift();
      g.digitsEl.removeChild(removed.el);
    }
  }

  function tick(immediate){
    if (!targetDate){ return; }
    var now = Date.now();
    var diffMs = targetDate.getTime() - now;
    var totalSeconds = Math.floor(Math.abs(diffMs) / 1000);
    var remainder = totalSeconds;

    var order = UNIT_DEFS.filter(function(u){ return selected.has(u.key); });
    order.forEach(function(u){
      var val = Math.floor(remainder / u.secs);
      remainder = remainder % u.secs;
      var str = String(val);
      if (str.length < 2) str = '0'.repeat(2 - str.length) + str;

      ensureCellCount(u.key, str.length);
      var g = groups[u.key];
      for (var i = 0; i < g.cells.length; i++){
        g.cells[i].setValue(str[i], immediate);
      }
    });
  }

  /* ---------- tabs ---------- */
  var tabListEl = document.getElementById('tab-list');
  var dateInput = document.getElementById('target-date-input');
  var timeInput = document.getElementById('target-time-input');
  var addBtn = document.getElementById('add-btn');
  var miniChips = Array.prototype.slice.call(document.querySelectorAll('.mini-chip'));

  function pad(n){ return String(n).padStart(2, '0'); }
  function toLocalDateValue(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toLocalTimeValue(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function formatShort(d){
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderTabList(){
    tabListEl.innerHTML = '';
    tabs.forEach(function(tab, idx){
      var item = document.createElement('div');
      item.className = 'tab-item' + (tab.id === activeId ? ' active' : '');
      item.dataset.id = String(tab.id);

      var main = document.createElement('div');
      main.className = 'tab-main';

      var titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.className = 'tab-title-input';
      titleInput.value = plainText(tab);
      titleInput.placeholder = 'Countdown ' + (idx + 1);
      titleInput.setAttribute('aria-label', 'Titel für diesen Countdown');
      titleInput.addEventListener('click', function(e){ e.stopPropagation(); });
      titleInput.addEventListener('focus', function(){
        if (activeId !== tab.id) setActive(tab);
      });
      titleInput.addEventListener('input', function(){
        /* editing the plain text in the sidebar resets rich formatting for this title */
        tab.titleRuns = titleInput.value ? [defaultRun(titleInput.value)] : [];
        if (activeId === tab.id) syncTitleDisplay();
        saveState();
      });

      var dateEl = document.createElement('span');
      dateEl.className = 'tab-date';
      dateEl.textContent = formatShort(tab.targetDate);

      main.appendChild(titleInput);
      main.appendChild(dateEl);

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'tab-remove';
      remove.setAttribute('aria-label', 'Countdown entfernen');
      remove.textContent = '×';
      remove.addEventListener('click', function(e){
        e.stopPropagation();
        removeTab(tab.id);
      });

      item.appendChild(main);
      item.appendChild(remove);
      item.addEventListener('click', function(){ setActive(tab); });
      tabListEl.appendChild(item);
    });
    applySidebarLockState(); /* fresh rows need their disabled state (re)applied too */
  }

  /* toggles which row looks active without rebuilding the list (keeps a focused title input intact) */
  function updateActiveHighlight(){
    var rows = tabListEl.querySelectorAll('.tab-item');
    for (var i = 0; i < rows.length; i++){
      rows[i].classList.toggle('active', rows[i].dataset.id === String(activeId));
    }
  }

  /* ---------- title heading — rich text (per-range bold/italic/color/size) + free drag position ---------- */
  var stageEl = document.querySelector('.stage'); /* the digit-groups vertical-drag range */
  var countdownAreaEl = document.getElementById('countdown-area'); /* the title's whole coordinate space + drag range */
  var titleZoneEl = document.getElementById('title-zone');
  var titleToolbarEl = document.getElementById('title-toolbar'); /* the small drag-handle chip — JS-positioned to hover just above the title */
  var titleEl = document.getElementById('countdown-title');
  var tbHandle = document.getElementById('tb-handle');
  var titleFormatEl = document.getElementById('title-format'); /* sidebar panel — the formatting controls live here now */
  var tfVisible = document.getElementById('tf-visible');
  var tbSize = document.getElementById('tf-size');
  var tbSizeValue = document.getElementById('tf-size-value');
  var tfFont = document.getElementById('tf-font');
  var tbColor = document.getElementById('tf-color');
  var tbBold = document.getElementById('tf-bold');
  var tbItalic = document.getElementById('tf-italic');
  var tbAlignBtns = Array.prototype.slice.call(document.querySelectorAll('.tf-align'));
  var tfGradientEnabled = document.getElementById('tf-gradient-enabled');
  var tfGradientControls = document.getElementById('tf-gradient-controls');
  var tfGradientFrom = document.getElementById('tf-gradient-from');
  var tfGradientTo = document.getElementById('tf-gradient-to');
  var tfGradientDirBtns = Array.prototype.slice.call(document.querySelectorAll('.tf-gradient-dir'));

  function activeTab(){ return tabs.find(function(t){ return t.id === activeId; }); }

  /* ---- run model helpers ---- */
  function runsInRange(runs, start, end){
    var pos = 0, out = [];
    runs.forEach(function(r){
      var rs = pos, re = pos + r.text.length;
      if (re > start && rs < end) out.push(r);
      pos = re;
    });
    return out;
  }
  function rangeUniform(tab, start, end, prop){
    var runs = start === end ? tab.titleRuns : runsInRange(tab.titleRuns, start, end);
    if (runs.length === 0) return undefined;
    var first = runs[0][prop];
    var allSame = runs.every(function(r){ return r[prop] === first; });
    return allSame ? first : undefined;
  }
  function splitRunsAtOffsets(runs, offsets){
    var result = [], pos = 0;
    runs.forEach(function(run){
      var runStart = pos, runEnd = pos + run.text.length;
      var cuts = offsets.filter(function(o){ return o > runStart && o < runEnd; }).sort(function(a,b){ return a-b; });
      var segStart = runStart;
      cuts.forEach(function(cut){
        result.push(Object.assign({}, run, { text: run.text.slice(segStart - runStart, cut - runStart) }));
        segStart = cut;
      });
      result.push(Object.assign({}, run, { text: run.text.slice(segStart - runStart) }));
      pos = runEnd;
    });
    return result.filter(function(r){ return r.text.length > 0; });
  }
  function applyFormatToRange(tab, start, end, setter){
    if (!tab.titleRuns.length) return;
    if (start === end){
      tab.titleRuns.forEach(setter);
      return;
    }
    var runs = splitRunsAtOffsets(tab.titleRuns, [start, end]);
    var pos = 0;
    runs.forEach(function(run){
      var rs = pos, re = pos + run.text.length;
      if (rs >= start && re <= end) setter(run);

  /* ---- selection <-> plain-text offsets (works across the run <span> elements) ---- */
  function getSelectionOffsets(){
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    var range = sel.getRangeAt(0);
    if (!titleEl.contains(range.commonAncestorContainer)) return null;
    var pre = document.createRange();
    pre.selectNodeContents(titleEl);
    pre.setEnd(range.startContainer, range.startOffset);
    var start = pre.toString().length;
    var end = start + range.toString().length;
    return { start:start, end:end };
  }
  function findTextNodeAtOffset(root, offset){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var acc = 0, node, last = null;
    while ((node = walker.nextNode())){
      var len = node.textContent.length;
      if (acc + len >= offset) return { node:node, offset:offset - acc };
      acc += len;
      last = node;
    }
    if (last) return { node:last, offset:last.textContent.length };
    return null;
  }

    var startPos = findTextNodeAtOffset(titleEl, start);
    var endPos = findTextNodeAtOffset(titleEl, end);
    if (!startPos || !endPos) return;
    var range = document.createRange();
    range.setStart(startPos.node, startPos.offset);
    range.setEnd(endPos.node, endPos.offset);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

  function renderRuns(tab){
    titleEl.innerHTML = '';

       run's color is deliberately NOT applied to its span here; it stays stored on the run
       untouched and simply starts being used again the moment the gradient is switched off. */

      if (!run.text) return;

      if (run.bold) span.style.fontWeight = '700';
      if (run.italic) span.style.fontStyle = 'italic';
      if (run.color && !gradientOn) span.style.color = run.color;
      if (run.fontSize) span.style.fontSize = run.fontSize + 'px';
      var stack = fontStackFor(run.fontFamily);
      if (stack) span.style.fontFamily = stack;

     renderRuns() above skips applying while a gradient is on). Bold/italic/fontSize per run are
     unaffected either way — only color is ever overridden. ---- */

  function syncToolbarSelectionState(){

       synced unconditionally here rather than inside the "no text" branch's resetFormatControls().

     a Selection inside a contenteditable focuses it, per spec). Doing that from inside THIS

    var v = tfFont.value;
    applyFormatToRange(tab, savedSelection.start, savedSelection.end, function(run){ run.fontFamily = v; });
    afterFormatChange(tab);
  });

  tbBold.addEventListener('click', function(){
    var tab = activeTab();
    if (!tab) return;
    var next = !rangeUniform(tab, savedSelection.start, savedSelection.end, 'bold');
    applyFormatToRange(tab, savedSelection.start, savedSelection.end, function(run){ run.bold = next; });

    var tab = activeTab();
    if (!tab) return;

  tbAlignBtns.forEach(function(btn){

  /* ---- drag the title freely anywhere in the countdown area (grab the handle, not the text itself) ---- */

  /* the form always edits whichever tab is active — each tab keeps its own date + units.

    timeInput.value = toLocalTimeValue(tab.targetDate);

      btn.classList.toggle('active', tab.units.has(btn.dataset.unit));
    });
  }

  function setActive(tab){

    applyGlow(tab);

  function removeTab(id){

  addBtn.addEventListener('click', function(){

     treated as invalid, since the date alone is still a perfectly usable target; an empty/invalid

    var tab = tabs.find(function(t){ return t.id === activeId; });

    var parsed = rawDate ? new Date(rawDate + 'T' + rawTime) : null;
    if (!parsed || isNaN(parsed.getTime())){

      setTimeout(function(){ dateInput.classList.remove('invalid'); }, 450);
      return;

    tab.targetDate = parsed;
    targetDate = parsed;

  timeInput.addEventListener('change', applyDateTimeInputs);

  miniChips.forEach(function(btn){

  /* ---------- segment color picker — per countdown ---------- */
  var segmentColorInput = document.getElementById('segment-color');
  function applySegmentColor(tab){

  segmentColorInput.addEventListener('input', function(){

  /* ---------- glow toggle — per countdown, off by default; lights up the segments currently
     "on" in their configured segment color via a CSS drop-shadow (see .digit-groups.glow-on) ---------- */
  var glowToggle = document.getElementById('glow-toggle');
  function applyGlow(tab){
    var on = !!(tab && tab.glow);
    digitGroupsEl.classList.toggle('glow-on', on);
    glowToggle.checked = on;
  }
  glowToggle.addEventListener('change', function(){
    var tab = activeTab();
    if (!tab) return;
    tab.glow = glowToggle.checked;
    digitGroupsEl.classList.toggle('glow-on', tab.glow);
    saveState();
  });

  /* ---------- per-tab image — shown above the whole countdown, freely draggable anywhere in the
     countdown area exactly like the title; see .image-wrap/.countdown-image in the CSS and
     downscaleImage() above for why the stored src is already a small, compressed JPEG ---------- */
  var imageWrapEl = document.getElementById('image-wrap');
  var imageHandle = document.getElementById('image-handle');
  var countdownImageEl = document.getElementById('countdown-image');
  var imageUploadInput = document.getElementById('image-upload');
  var imageUploadBtn = document.getElementById('image-upload-btn');
  var imageRemoveBtn = document.getElementById('image-remove-btn');
  var imageScaleRow = document.getElementById('image-scale-row');
  var imageScaleSlider = document.getElementById('image-scale-slider');
  var imageScaleValueEl = document.getElementById('image-scale-value');

  function applyImage(tab){
    var img = (tab && tab.image) || defaultImage();
    if (img.src){
      countdownImageEl.src = img.src;
      imageWrapEl.hidden = false;
      imageScaleRow.hidden = false;
    } else {
      countdownImageEl.removeAttribute('src');
      imageWrapEl.hidden = true;
      imageScaleRow.hidden = true;
    }
    var scale = clampImageScale(typeof img.scale === 'number' ? img.scale : DEFAULT_IMAGE_SCALE);
    countdownImageEl.style.setProperty('--image-scale', scale);
    imageScaleSlider.value = scale;
    imageScaleValueEl.textContent = Math.round(scale * 100) + '%';
    positionImage();
  }

  /* ---- image position: a free 2-D drag exactly like the title's (grab the handle, not the
     image itself — same reasoning as the title's own handle, plus it sidesteps the browser's
     native image drag-and-drop), and deliberately fully independent of the digits' own vertical
     drag — an earlier version made the image follow the digits' offset, but that was reverted:
     dragging the numbers is meant to open up real free space for the image/title, which it can't
     do if they're glued together. Move the image out of the way yourself instead. ---- */
  function positionImage(){
    var tab = activeTab();
    if (!tab || imageWrapEl.hidden) return;
    var pos = tab.imagePos || defaultImagePos();
    var areaRect = countdownAreaEl.getBoundingClientRect();
    var imgRect = imageWrapEl.getBoundingClientRect();
    var maxX = Math.max(0, areaRect.width - imgRect.width);
    var maxY = Math.max(0, areaRect.height - imgRect.height);
    imageWrapEl.style.left = (pos.xPct * maxX) + 'px';
    imageWrapEl.style.top = (pos.yPct * maxY) + 'px';
  }
  if (window.ResizeObserver){
    new ResizeObserver(function(){ positionImage(); }).observe(imageWrapEl);
  }

  var imageDragState = null;
  imageHandle.addEventListener('pointerdown', function(e){
    if (locked) return;
    var tab = activeTab();
    if (!tab) return;
    e.preventDefault();
    var areaRect = countdownAreaEl.getBoundingClientRect();
    var imgRect = imageWrapEl.getBoundingClientRect();
    imageDragState = {
      pointerId: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      startLeft: imgRect.left - areaRect.left,
      startTop: imgRect.top - areaRect.top,
      maxX: Math.max(0, areaRect.width - imgRect.width),
      maxY: Math.max(0, areaRect.height - imgRect.height)
    };
    imageHandle.setPointerCapture(e.pointerId);
    imageWrapEl.classList.add('dragging');
  });
  imageHandle.addEventListener('pointermove', function(e){
    if (!imageDragState) return;
    var dx = e.clientX - imageDragState.startX;
    var dy = e.clientY - imageDragState.startY;
    var left = Math.min(Math.max(imageDragState.startLeft + dx, 0), imageDragState.maxX);
    var top = Math.min(Math.max(imageDragState.startTop + dy, 0), imageDragState.maxY);
    imageWrapEl.style.left = left + 'px';
    imageWrapEl.style.top = top + 'px';
  });
  function endImageDrag(){
    if (!imageDragState) return;
    var tab = activeTab();
    if (tab){
      var xPct = imageDragState.maxX > 0 ? clamp01(parseFloat(imageWrapEl.style.left) / imageDragState.maxX) : 0;
      var yPct = imageDragState.maxY > 0 ? clamp01(parseFloat(imageWrapEl.style.top) / imageDragState.maxY) : 0;
      tab.imagePos = { xPct:xPct, yPct:yPct };
      saveState();
    }
    imageDragState = null;
    imageWrapEl.classList.remove('dragging');
  }
  imageHandle.addEventListener('pointerup', endImageDrag);
  imageHandle.addEventListener('pointercancel', endImageDrag);

  imageUploadBtn.addEventListener('click', function(){
    if (locked) return;
    imageUploadInput.click();
  });
  imageUploadInput.addEventListener('change', function(){
    var file = imageUploadInput.files && imageUploadInput.files[0];
    imageUploadInput.value = ''; /* clears the picker so re-selecting the same file still fires 'change' next time */
    if (!file || !/^image\//.test(file.type)) return;
    var tab = activeTab();
    if (!tab) return;
    var reader = new FileReader();
    reader.onload = function(){
      var probe = new Image();
      probe.onload = function(){
        var dataUrl = downscaleImage(probe, IMAGE_MAX_WIDTH, IMAGE_JPEG_QUALITY);
        tab.image = tab.image || defaultImage();
        tab.image.src = dataUrl;
        applyImage(tab);
        applySidebarLockState();
        saveState();
      };
      probe.src = reader.result; /* onerror is deliberately not handled — an unreadable/corrupt
        file just silently doesn't produce an image, no different from not uploading one */
    };
    reader.readAsDataURL(file);
  });
  imageRemoveBtn.addEventListener('click', function(){
    var tab = activeTab();
    if (!tab) return;
    tab.image = defaultImage();
    applyImage(tab);
    applySidebarLockState();
    saveState();
  });
  imageScaleSlider.addEventListener('input', function(){
    var tab = activeTab();
    if (!tab || !tab.image || !tab.image.src) return;
    tab.image.scale = clampImageScale(parseFloat(imageScaleSlider.value));
    countdownImageEl.style.setProperty('--image-scale', tab.image.scale);
    imageScaleValueEl.textContent = Math.round(tab.image.scale * 100) + '%';
    positionImage();
    saveState();
  });

  /* ---------- auto-fit: the digit display must always fit within .stage's fixed, non-scrolling
     box (see the fixed-viewport-shell CSS comment near the top) — .stage's own overflow:hidden
     is only the last-resort safety net; this is what keeps that net from ever actually needing
     to clip anything in normal use.

     Bug fixed — the size slider used to feel broken ("erst passiert lange nichts, dann springt
     die Anzeige plötzlich viel kleiner, und danach wieder größer"): the OLD design ran a
     shrink-only correction UNDERNEATH the slider's raw value — the slider itself always spanned
     the full fixed [MIN_SCALE, MAX_SCALE] range and showed the user's raw preference, while the
     ACTUAL rendered --scale was separately re-derived from that preference and silently
     shrunk to fit whenever it didn't. That meant large stretches of the slider's range could
     render IDENTICALLY (once the raw preference exceeded what fits, every further increase kept
     getting shrunk back down to roughly the same fitted ceiling — a dead zone), and because the
     shrink correction re-measures against the CURRENT flex-wrapped layout at each raw value, a
     small drag right past a flex-wrap threshold could suddenly require an extra row and shrink a
     lot more than the position just before it did — a visible jump, sometimes in the "wrong"
     direction relative to the drag.

     The fix makes the auto-fit define ONLY the slider's ceiling, never a second silent
     correction layered under it: `maxFitScale` is the largest scale that currently fits (computed
     below, independent of whatever the slider happens to be showing), the slider's own `max`
     attribute is kept live-synced to it, and the rendered scale is then a plain
     `Math.min(displayScale, maxFitScale)` — since the browser physically won't let the slider be
     dragged past its own `max`, that min() is a no-op for every value actually reachable by
     dragging, so the rendered size tracks the slider position exactly, 1:1, with no dead zone and
     no reversal. `displayScale` itself still stores the user's raw, un-clamped preference (bounded
     only by the fixed MIN_SCALE/MAX_SCALE, same as before) — never permanently overwritten with a
     ceiling-clamped value — so shrinking the window only ever clamps the RENDERED/slider-visible
     value, and widening it again still springs back to the real stored preference, exactly like
     the old shrink-only correction did. ---------- */
  var maxFitScale = MAX_SCALE; /* recomputed below before first real use — see updateScaleCeiling() call sites */
  /* Finds the single largest scale (up to MAX_SCALE) that fits .stage's available, padding-
     adjusted box for the ACTIVE tab's current digit/unit content — i.e. the ceiling, computed
     fresh every time regardless of what the slider currently shows. Uses a small bounded
     measure-and-shrink loop rather than a single correction, because the digit groups' flex-wrap
     onto a new row is a step change, not a smooth one: a single correction computed while still
     wrapped can overshoot once the smaller size lets everything fit back on one row. */
  var MIN_FIT_SCALE = 0.05; /* absolute floor the search bottoms out at — matches the old shrink loop's floor */
  /* Bug fixed — this used to be a multiplicative shrink-from-MAX_SCALE loop (mirroring the old
     fitDigitsScale()'s shrink-from-displayScale one), and it badly OVER-shrank on almost every
     window size: starting the very first measurement at MAX_SCALE (1.6×) reliably crosses the
     digit groups' flex-wrap threshold — 4 unit groups at 1.6× essentially never fit on one row, so
     they stack into a tall multi-row column instead. The one-shot correction `scale *= fit` then
     extrapolates from THAT wrapped, several-times-taller-than-normal box, landing on a scale far
     smaller than what actually fits once unwrapped — and because the loop accepted the very first
     scale where `fit >= 0.999` as "done", it never tried growing back up to see whether a
     considerably larger, still-unwrapped scale would ALSO fit. (The old fitDigitsScale() mostly
     dodged this because it started from `displayScale`, which defaults to 1.0 and is rarely large
     enough to trigger wrapping — but always starting from MAX_SCALE here hit it on nearly every
     test size, confirmed by tracing the per-iteration measurements.)

     Fixed with a binary search instead of a multiplicative correction: `fitsAt(scale)` is a plain
     membership test (does the digit box, measured at this exact scale, fit the available space?)
     with no assumption that size scales linearly with `scale` — flex-wrap's step-change behavior
     can't fool it, because it never extrapolates from one measurement to guess another, it only
     ever narrows the [lo, hi] interval based on direct measurements at the midpoint. Converges to
     the true boundary in a fixed number of steps regardless of how many wrap thresholds sit
     between MIN_FIT_SCALE and MAX_SCALE. */
  function computeMaxFitScale(){
    function fitsAt(scale){
      digitGroupsEl.style.setProperty('--scale', scale); /* transient — the real final value is set by applyDisplayScale() right after this returns */
      var stageRect = stageEl.getBoundingClientRect();
      var areaStyle = getComputedStyle(countdownAreaEl);
      var availW = Math.max(0, stageRect.width - parseFloat(areaStyle.paddingLeft) - parseFloat(areaStyle.paddingRight));
      var availH = Math.max(0, stageRect.height - parseFloat(areaStyle.paddingTop) - parseFloat(areaStyle.paddingBottom));
      var digitsRect = digitGroupsEl.getBoundingClientRect();
      /* a 0-width/height measurement (some browsers collapse the flex-wrapped box entirely at
         extremely tight available space instead of overflowing) has no valid box to compare —
         treated as "doesn't fit" so the search narrows toward smaller scales, same outcome the old
         loop's explicit degenerate-recovery branch produced. */
      if (digitsRect.width <= 0 || digitsRect.height <= 0) return false;
      return digitsRect.width <= availW + 0.5 && digitsRect.height <= availH + 0.5;
    }
    if (fitsAt(MAX_SCALE)) return MAX_SCALE; /* common on large windows — skip the search entirely */
    if (!fitsAt(MIN_FIT_SCALE)) return MIN_FIT_SCALE; /* the residual extreme case: not even the floor fits — nothing more to do, see CLAUDE.md */
    var lo = MIN_FIT_SCALE, hi = MAX_SCALE; /* invariant: lo fits, hi does not */
    for (var i = 0; i < 10; i++){
      var mid = (lo + hi) / 2;
      if (fitsAt(mid)) lo = mid; else hi = mid;
    }
    digitGroupsEl.style.setProperty('--scale', lo); /* leave the transient measurement at a value known to fit */
    return lo;
  }
  /* the single entry point for "the available space or the active tab's content may have
     changed, recompute the ceiling and re-render against it" — call this (not
     computeMaxFitScale() directly) from every trigger site: window/sidebar resize, tab switch,
     unit toggle, font-load settle, and boot. Re-applies the STORED `displayScale` (never the
     slider's possibly-stale-clamped .value) against the fresh ceiling, which is what lets a
     preference larger than the current ceiling spring back once more room appears. */
  function updateScaleCeiling(){
    maxFitScale = computeMaxFitScale();
    applyDisplayScale(displayScale);
  }
  /* the Google Fonts <link> loads asynchronously; when the unit labels (Tage/Stunden/…) swap
     from the fallback font to Rajdhani, their text metrics change, which can shift how the unit
     groups flex-wrap — after the fit above already ran against the pre-swap layout. Re-running
     once the browser has settled on its fonts catches that case; harmless if it changes nothing. */
  if (window.document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      updateScaleCeiling();
      positionTitle();
      positionImage();
    });
  }

  /* ---------- display size slider — fine-tunes the digit display within its viewport-auto-fit frame ---------- */
  var scaleSlider = document.getElementById('scale-slider');
  var scaleValueEl = document.getElementById('scale-value');
  function applyDisplayScale(v){
    displayScale = clampScale(v); /* the raw preference — bounded only by the fixed [MIN_SCALE, MAX_SCALE], never by the current ceiling */
    var renderScale = Math.min(displayScale, maxFitScale);
    digitGroupsEl.style.setProperty('--scale', renderScale);
    /* keep the slider's own draggable range pinned to what currently fits — Math.max guards
       against maxFitScale ever dipping below the slider's fixed `min`, which would otherwise
       produce an invalid (max < min) range */
    scaleSlider.max = String(Math.max(MIN_SCALE, maxFitScale));
    scaleSlider.value = String(renderScale);
    scaleValueEl.textContent = Math.round(renderScale * 100) + '%'; /* shows what's actually on screen, not an un-renderable raw preference */
    positionTitle();
    positionDigits();
    positionImage();
    return renderScale;
  }
  scaleSlider.addEventListener('input', function(){
    applyDisplayScale(parseFloat(scaleSlider.value));
    saveState();
  });

  /* ---------- sidebar toggle ---------- */
  var appEl = document.querySelector('.app');
  var sidebarEl = document.getElementById('sidebar');
  var sidebarToggle = document.getElementById('sidebar-toggle');
  var sidebarCollapsed = false;
  sidebarToggle.addEventListener('click', function(){
    sidebarCollapsed = !sidebarCollapsed;
    appEl.classList.toggle('collapsed', sidebarCollapsed);
    sidebarToggle.textContent = sidebarCollapsed ? '›' : '‹';
    sidebarToggle.setAttribute('aria-expanded', String(!sidebarCollapsed));
    sidebarEl.inert = sidebarCollapsed;
  });

  /* ---------- lock toggle — freezes EVERYTHING: dragging, text editing/selection, formatting,
     and every sidebar editing control. Countdowns become pure view-only display (the timers keep
     ticking); only the lock button itself, the sidebar collapse toggle, and switching between
     existing tabs (to look at a different countdown) remain usable. ---------- */
  var lockToggle = document.getElementById('lock-toggle');
  var lockLabel = document.getElementById('lock-label');

  /* grays out / disables every sidebar editing control (title rename & remove, add, date/units,
     segment color, glow, title formatting, display size) — called whenever the lock toggles AND
     whenever the tab list or active tab changes, since those can create fresh controls or change
     whether a control has an active tab to edit at all. */
  function applySidebarLockState(){
    var tab = activeTab();
    var hasTab = !!tab;
    var hasImage = !!(tab && tab.image && tab.image.src);
    addBtn.disabled = locked;
    segmentColorInput.disabled = locked || !hasTab;
    glowToggle.disabled = locked || !hasTab;
    imageUploadBtn.disabled = locked || !hasTab;
    imageRemoveBtn.disabled = locked || !hasImage;
    imageScaleSlider.disabled = locked || !hasImage;
    tfVisible.disabled = locked;
    tbSize.disabled = locked;
    tfFont.disabled = locked;
    tbColor.disabled = locked;
    tbBold.disabled = locked;
    tbItalic.disabled = locked;
    tbAlignBtns.forEach(function(btn){ btn.disabled = locked; });
    tfGradientEnabled.disabled = locked;
    tfGradientFrom.disabled = locked;
    tfGradientTo.disabled = locked;
    tfGradientDirBtns.forEach(function(btn){ btn.disabled = locked; });
    scaleSlider.disabled = locked;
    Array.prototype.slice.call(tabListEl.querySelectorAll('.tab-title-input, .tab-remove')).forEach(function(el){
      el.disabled = locked;
    });
  }

  function applyLockState(v){
    locked = !!v;
    appEl.classList.toggle('locked', locked);
    lockToggle.setAttribute('aria-pressed', String(locked));
    lockToggle.setAttribute('aria-label', locked ? 'Bearbeitung entsperren' : 'Bearbeitung sperren');
    lockLabel.textContent = locked ? 'Gesperrt' : 'Entsperrt';
    titleEl.contentEditable = String(!locked); /* belt-and-suspenders alongside the CSS pointer-events block */
    applySidebarLockState();
    syncFormToActiveTab();
  }
  lockToggle.addEventListener('click', function(){
    applyLockState(!locked);
    saveState();
  });

  /* ---------- boot ---------- */
  var restored = loadState();
  if (restored){
    tabs = restored.tabs;
    nextId = tabs.reduce(function(max, t){ return Math.max(max, t.id); }, 0) + 1;
    var restoredActive = tabs.find(function(t){ return t.id === restored.activeId; }) || tabs[0];
    activeId = restoredActive.id;
    targetDate = restoredActive.targetDate;
    selected = restoredActive.units;
    applyDisplayScale(restored.displayScale);
    applySegmentColor(restoredActive);
    applyGlow(restoredActive);
    applyImage(restoredActive);
    applyLockState(restored.locked);
    rebuildGroups();
    tick(true); /* rebuildGroups() only builds the empty unit-group containers — the actual digit
      cells are created lazily by tick()'s ensureCellCount(), same as setActive() already does.
      Without this, updateScaleCeiling() below would measure an empty shell and under-correct. */
    renderTabList();
    syncFormToActiveTab();
    updateScaleCeiling(); /* applyDisplayScale() above ran before rebuildGroups()/tick() had real content to measure — redo it now that the digits actually exist */
    positionDigits();
    syncTitleDisplay();
  } else {
    var demoTarget = new Date(Date.now() + 24 * 3600 * 1000);
    var demoTab = { id: nextId++, titleRuns: [], targetDate: demoTarget, units: new Set(['d','h','m','s']), format: defaultFormat(), segmentColor: DEFAULT_SEG_COLOR, titleVisible: true, glow: false, gradient: defaultGradient(), image: defaultImage(), imagePos: defaultImagePos(), digitsYPct: 0.5 };
    tabs.push(demoTab);
    activeId = demoTab.id;
    targetDate = demoTab.targetDate;
    selected = demoTab.units;
    applyDisplayScale(DEFAULT_SCALE);
    applySegmentColor(demoTab);
    applyGlow(demoTab);
    applyImage(demoTab);
    applyLockState(false);
    rebuildGroups();
    tick(true); /* rebuildGroups() only builds the empty unit-group containers — the actual digit
      cells are created lazily by tick()'s ensureCellCount(), same as setActive() already does.
      Without this, updateScaleCeiling() below would measure an empty shell and under-correct. */
    renderTabList();
    syncFormToActiveTab();
    updateScaleCeiling(); /* applyDisplayScale() above ran before rebuildGroups()/tick() had real content to measure — redo it now that the digits actually exist */
    positionDigits();
    syncTitleDisplay();
    saveState();
  }

  setTimeout(function(){ tick(false); }, 220);
  setInterval(function(){ tick(false); }, 1000);
})();
</script>

</body></html>
